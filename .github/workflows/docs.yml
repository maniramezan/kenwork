name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build aggregated API docs
        run: ./gradlew dokkaGenerate

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  # Deploy runs as its own job so "Re-run failed jobs" redeploys the existing artifact
  # instead of uploading a second "github-pages" artifact, which deploy-pages rejects.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
